name: Manager tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cyberwall_master_manager/**'
      - '.github/workflows/windows-portable.yml'
      - '.github/actions/reader-release/**'
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: CyberpunkMasterManager
      - name: Get latest stable wcopy_reader release
        id: reader_release
        uses: ./CyberpunkMasterManager/.github/actions/reader-release
        with:
          token: ${{ github.token }}
          minimum-version: '1.7.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test dependencies
        working-directory: CyberpunkMasterManager/cyberwall_master_manager
        run: python -m pip install -r requirements.txt
      - name: Test application and builder
        working-directory: CyberpunkMasterManager/cyberwall_master_manager
        run: python -m unittest discover -s tests -v
      - name: Full standalone ZIP location
        shell: pwsh
        run: |
          'Full ZIP with printing is built in [CyberpunkIdPrinter / Windows standalone manager](https://github.com/limbura/CyberpunkIdPrinter/actions/workflows/windows-manager.yml).' >> $env:GITHUB_STEP_SUMMARY
