name: Manager tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cyberwall_master_manager/**'
      - '.github/workflows/windows-portable.yml'
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: CyberpunkMasterManager
      - uses: actions/checkout@v4
        with:
          repository: limbura/CyberpunkPcRfidReader
          ref: d51466c2ac952eac8307366b3059fa0e7bb12282
          path: CyberpunkPcRfidReader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test dependencies
        working-directory: CyberpunkMasterManager/cyberwall_master_manager
        run: python -m pip install -r requirements.txt
      - name: Test application and builder
        working-directory: CyberpunkMasterManager/cyberwall_master_manager
        run: python -m unittest discover -s tests -v
      - name: Full standalone ZIP location
        shell: pwsh
        run: |
          'Full ZIP with printing is built in [CyberpunkIdPrinter / Windows standalone manager](https://github.com/limbura/CyberpunkIdPrinter/actions/workflows/windows-manager.yml). That private repository owns the printer source and can check out all dependencies without a cross-repository secret.' >> $env:GITHUB_STEP_SUMMARY
