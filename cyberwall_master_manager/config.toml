# Настройки CYBERWALL - менеджмент для мастеров. Python 3.11+.
# Значения первого входа. После успешного входа используется сохранённое подключение.
# Для смены подключения: :menu → 5 — отключиться от БД. Пароля в этом файле нет.
[database]
host = "188.134.70.190"
port = 3306
user = "master"
name = "cyberwall"
connect_timeout = 10
read_timeout = 30
write_timeout = 30

[interface]
page_size = 15

[reader]
enabled = true
# Относительный путь считается от папки программы, не от текущей папки консоли.
library_path = "../../CyberpunkPcRfidReader/wcopy_reader_package"
write_beep_t = 10
timeout_ms = 750
poll_interval = 0.25
error_retry_interval = 1.5
feedback_retry_interval = 1.0

[state]
pending_id_file = "pending_id_change.json"
# Список аккаунтов и результаты пакетной записи. Не удалять для продолжения работы.
batch_cards_file = "batch_cards.json"

# Термопринтер опционален: без установленной библиотеки остальные функции работают.
[printer]
enabled = true
# Заполняется после успешного выбора через :printer. Не имя модели по умолчанию.
address = "EB:11:06:26:77:26"
name = "MX10"
auto_connect = true
auto_reconnect = true
reconnect_delay_seconds = 5
scan_timeout_seconds = 15
connection_check_seconds = 2
blackening = 3
max_copies = 100
# Все относительные пути — от папки этого config.toml.
# Пустой library_path — использовать только установленный пакет Python.
library_path = "../../CyberpunkIdPrinter"
timini_path = "../../TiMini-Print"

[printer.paper]
# labels: LabelPrinter для одиночной печати и серий (v5g_small_203).
type = "labels"
roll_width_mm = 57
width_mm = 40
height_mm = 30
offset_x_mm = -4
dpi = 203.2

[printer.layout]
inactive_segments = true
decorations = true

# Одиночная печать и серии при paper.type = "labels".
[printer.labels]
feed_mm = 15.0                 # Выдача после последней копии, мм (0.25…25).
gap_mm = 2.0                   # Подача между копиями: расстояние между этикетками, мм (0.25…25).
retract_mm = 25.0              # Обратное втягивание перед следующей печатью, мм (0.25…25).
position_timeout = 20.0        # Таймаут ожидания завершения калибровки, секунды (> 0).
settle_seconds = 3.0           # Ожидание после передачи изображения, секунды (не менее 2).
motion_settle_seconds = 5.0    # Ожидание после протяжки/втягивания, секунды (не менее 2).
