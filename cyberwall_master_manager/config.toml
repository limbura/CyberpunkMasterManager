# Настройки CYBERWALL - менеджмент для мастеров. Python 3.11+.
# Значения первого входа. После успешного входа используется сохранённое подключение.
# Для смены подключения: :disconnect — Отключиться от БД. Пароля в этом файле нет.
[database]
host = "188.134.70.190"
port = 3306
user = "master"
name = "cyberwall"
connect_timeout = 10
read_timeout = 30
write_timeout = 30

[interface]
page_size = 15

[reader]
enabled = true
# Относительный путь считается от папки программы, не от текущей папки консоли.
library_path = "../../CyberpunkPcRfidReader/wcopy_reader_package"
write_beep_t = 10
timeout_ms = 750
poll_interval = 0.25
error_retry_interval = 1.5
feedback_retry_interval = 1.0

[state]
pending_id_file = "pending_id_change.json"
# Список аккаунтов и результаты пакетной записи. Не удалять для продолжения работы.
batch_cards_file = "batch_cards.json"

# Термопринтер опционален: без установленной библиотеки остальные функции работают.
[printer]
enabled = true
# Заполняется после успешного выбора через :printer. Не имя модели по умолчанию.
address = ""
name = ""
auto_connect = true
auto_reconnect = true
reconnect_delay_seconds = 5
scan_timeout_seconds = 15
connection_check_seconds = 2
blackening = 3
max_copies = 100
# Все относительные пути — от папки этого config.toml.
# Пустой library_path — использовать только установленный пакет Python.
library_path = "../../CyberpunkIdPrinter"
timini_path = "../../TiMini-Print"

[printer.paper]
# labels разрешён только при поддержке аппаратных границ выбранным профилем.
type = "continuous"
roll_width_mm = 57
width_mm = 40
height_mm = 30
offset_x_mm = 0
dpi = 203.2

[printer.layout]
inactive_segments = true
decorations = true
